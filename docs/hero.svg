<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" font-family="Menlo, ui-monospace, SFMono-Regular, monospace">
  <title>AgentBar: the island around the notch, with a finished card and a waiting card under it</title>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5d6c88"/>
      <stop offset="1" stop-color="#2b3344"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screen"><rect width="960" height="280" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <!-- desktop and menu bar -->
    <rect width="960" height="280" fill="url(#desk)"/>
    <rect width="960" height="34" fill="#ffffff" fill-opacity="0.16"/>
    <g fill="#ffffff" fill-opacity="0.85" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13">
      <text x="22" y="22" font-weight="700">kitty</text>
      <text x="70" y="22">Shell</text>
      <text x="116" y="22">Edit</text>
      <text x="156" y="22">View</text>
      <text x="938" y="22" text-anchor="end">Thu 15 Oct  13:45</text>
    </g>

    <!-- the island: a black neck through the menu bar, flared where it meets the top edge -->
    <path d="M262 0 Q270 0 270 8 V22 Q270 35 283 35 H677 Q690 35 690 22 V8 Q690 0 698 0 Z" fill="#000"/>
    <g font-size="13" font-weight="700">
      <text x="290" y="23" fill="#d97757">✻</text>
      <text x="308" y="23" fill="#f5f5f5">2 busy</text>
      <text x="606" y="23" fill="#7aa3f7">⚙</text>
      <text x="622" y="23" fill="#f5f5f5">1</text>
      <text x="660" y="23" fill="#f5f5f5">9</text>
    </g>

    <!-- card: a turn finished -->
    <g filter="url(#lift)">
      <rect x="250" y="62" width="460" height="74" rx="12" fill="#000" stroke="#ffffff" stroke-opacity="0.12"/>
    </g>
    <text x="266" y="84" font-size="11"><tspan fill="#59d980">●</tspan><tspan dx="6" fill="#a3c7f5">~/code/garden-api</tspan></text>
    <text x="266" y="105" font-size="12" fill="#999">› add rate limiting to the upload endpoint</text>
    <text x="266" y="124" font-size="12" fill="#f5f5f5">Added a token bucket per API key. 42 tests pass.</text>

    <!-- card: waiting on you -->
    <g filter="url(#lift)">
      <rect x="250" y="146" width="460" height="74" rx="12" fill="#000" stroke="#ffffff" stroke-opacity="0.12"/>
    </g>
    <text x="266" y="168" font-size="11"><tspan fill="#f5a623">●</tspan><tspan dx="6" fill="#e9a8d8">~/code/notes-site</tspan></text>
    <text x="266" y="189" font-size="12" fill="#999">› publish the draft about notch apps</text>
    <text x="266" y="208" font-size="12" fill="#f5a623">Waiting on you: permission prompt</text>

    <!-- the pointer, about to click the finished card -->
    <path d="M672 108 L672 128 L677 123 L681 132 L684 131 L680 122 L687 122 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- callouts -->
    <g stroke="#ffffff" stroke-opacity="0.5" fill="none">
      <path d="M156 62 L298 30"/>
      <path d="M800 62 L664 30"/>
      <path d="M170 104 L250 104"/>
      <path d="M790 188 L710 188"/>
    </g>
    <g fill="#ffffff">
      <circle cx="298" cy="30" r="2.5"/><circle cx="664" cy="30" r="2.5"/>
      <circle cx="250" cy="104" r="2.5"/><circle cx="710" cy="188" r="2.5"/>
    </g>
    <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" fill="#ffffff">
      <text x="40" y="66" font-size="13" font-weight="600">Busy sessions</text>
      <text x="804" y="66" font-size="13" font-weight="600">Codex runs</text>
      <text x="804" y="83" font-size="11" fill-opacity="0.65">and live sessions</text>
      <text x="40" y="100" font-size="13" font-weight="600">Turn finished</text>
      <text x="40" y="117" font-size="11" fill-opacity="0.65">click to jump to it</text>
      <text x="796" y="184" font-size="13" font-weight="600">Waiting on you</text>
      <text x="796" y="201" font-size="11" fill-opacity="0.65">right-click to dismiss</text>
      <text x="480" y="254" font-size="12" fill-opacity="0.6" text-anchor="middle">Cards stay until you click them, or until you switch to that window.</text>
    </g>
  </g>
</svg>
